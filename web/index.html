<script>
  // Teilen im Browser (Web Share API mit Datei). Wird von Rust aufgerufen; in der APK übernimmt Android.
  window.wwpShare = async function (b64, mime, name, subject, text) {
    try {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const file = new File([bytes], name, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: subject || name, text: text || '' });
        return true;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return true;
    }
    return false;
  };
</script>
<script type="module">
  import init from './pkg/wwp.js';
  init().catch((e) => {
    document.getElementById('loading').innerHTML = '<span>Fehler beim Laden: ' + e + '</span>';
  });
</script>
