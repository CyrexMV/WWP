[package]
name = "wwp"
version = "1.0.0"
edition = "2021"
description = "WWP Büro – Kunden, Aufträge, Angebote, Rechnungen und Finanzen in Rust (WebAssembly/Android)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
miniz_oxide = "0.8"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "Node", "EventTarget", "Event",
  "MouseEvent", "KeyboardEvent", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement",
  "HtmlAnchorElement", "Blob", "BlobPropertyBag", "File", "FileList", "Url", "Storage",
  "Navigator", "ServiceWorkerContainer", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest",
  "IdbRequest", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "DomStringList",
  "VisibilityState", "DomTokenList", "CssStyleDeclaration", "Location",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
